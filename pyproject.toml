[project]
name = "universal-game-agent"
version = "0.1.0"
description = "A plugin-based AI-ready game agent framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
uga = "universal_game_agent.main:main"
uga-adb-doctor = "universal_game_agent.adb_doctor:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
